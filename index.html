<title>ND BURGS — Cardápio</title>

<style>

:root{
--bg:#0b0b0d;
--card:#151519;
--line:#29292f;
--text:#fff;
--muted:#a8a8b0;
--accent:#ffc400;
--green:#25d366;
}

*{
box-sizing:border-box;
}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:Arial,Helvetica,sans-serif;
}

header{
position:sticky;
top:0;
z-index:5;
background:rgba(11,11,13,.97);
border-bottom:1px solid var(--line);
padding:14px 16px;
}

.top{
max-width:1100px;
margin:auto;
display:flex;
gap:12px;
align-items:center;
justify-content:space-between;
}

.logo{
font-weight:900;
font-size:25px;
white-space:nowrap;
}

.logo span{
color:var(--accent);
}

.search{
width:min(430px,52vw);
background:#202025;
border:1px solid var(--line);
color:white;
border-radius:12px;
padding:12px 14px;
outline:0;
}

main{
max-width:1100px;
margin:auto;
padding:18px 16px 110px;
}

.cats{
display:flex;
gap:8px;
overflow:auto;
padding-bottom:12px;
scrollbar-width:none;
}

.cats::-webkit-scrollbar{
display:none;
}

.cats button{
white-space:nowrap;
border:1px solid var(--line);
background:#151519;
color:#ddd;
border-radius:999px;
padding:9px 13px;
font-weight:700;
cursor:pointer;
}

.cats button.active{
background:var(--accent);
color:#111;
border-color:var(--accent);
}

h2{
font-size:20px;
margin:24px 0 10px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}

.item{
background:var(--card);
border:1px solid var(--line);
border-radius:14px;
padding:10px;
display:flex;
justify-content:space-between;
gap:10px;
min-height:105px;
}

.itemInfo{
display:flex;
align-items:center;
gap:12px;
min-width:0;
}

.itemImage{
width:85px;
height:85px;
object-fit:cover;
border-radius:12px;
border:1px solid #29292f;
background:#0f0f12;
flex-shrink:0;
}

.itemText{
min-width:0;
}

.item h3{
font-size:15px;
margin:0 0 7px;
}

.cat{
color:var(--muted);
font-size:12px;
}

.price{
font-weight:900;
margin-top:7px;
color:#fff;
}

.add{
align-self:center;
background:var(--accent);
border:0;
border-radius:10px;
width:45px;
height:45px;
display:flex;
align-items:center;
justify-content:center;
font-weight:900;
font-size:28px;
line-height:1;
color:#111;
cursor:pointer;
flex-shrink:0;
}

.cartbar{
position:fixed;
left:0;
right:0;
bottom:0;
background:#111115;
border-top:1px solid var(--line);
padding:12px 16px;
z-index:10;
}

.cartbar>div{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.checkout{
background:var(--green);
border:0;
color:#071008;
font-weight:900;
border-radius:12px;
padding:13px 18px;
cursor:pointer;
}

.count{
font-size:12px;
color:var(--muted);
}

dialog{
border:0;
border-radius:18px;
background:#17171c;
color:#fff;
width:min(560px,94vw);
padding:0;
box-shadow:0 20px 80px #000;
}

dialog::backdrop{
background:#000b;
}

.modal{
padding:20px;
}

.close{
float:right;
background:none;
border:0;
color:#aaa;
font-size:25px;
cursor:pointer;
}

.rows{
max-height:300px;
overflow:auto;
margin:12px 0;
}

.row{
display:flex;
justify-content:space-between;
gap:8px;
padding:12px 0;
border-bottom:1px solid var(--line);
}

.qty{
display:flex;
align-items:center;
gap:8px;
white-space:nowrap;
}

.qty button{
background:#292930;
color:white;
border:0;
border-radius:7px;
width:30px;
height:30px;
font-size:18px;
cursor:pointer;
}

input,
textarea,
select{
width:100%;
margin:6px 0 10px;
background:#0f0f12;
border:1px solid var(--line);
color:white;
border-radius:10px;
padding:11px;
font-size:15px;
}

label{
font-size:13px;
font-weight:bold;
}

.send{
width:100%;
padding:14px;
border:0;
border-radius:12px;
background:var(--green);
font-weight:900;
font-size:16px;
cursor:pointer;
}

.empty{
color:var(--muted);
padding:25px 0;
text-align:center;
}

.trocoBox{
display:none;
}

.totalBox{
font-size:19px;
font-weight:900;
margin:10px 0 16px;
padding:12px;
background:#101014;
border-radius:10px;
}

.produtoHeader{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:15px;
margin-bottom:15px;
}

.produtoNome{
font-size:21px;
font-weight:900;
margin:0 0 6px;
}

.produtoPreco{
font-size:18px;
font-weight:900;
color:var(--accent);
}

.produtoImagem{
width:100%;
max-height:250px;
object-fit:cover;
border-radius:14px;
margin-bottom:15px;
border:1px solid var(--line);
}

.addonArea{
max-height:280px;
overflow:auto;
margin-bottom:15px;
}

.addonItem{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
padding:11px;
margin-bottom:7px;
background:#0f0f12;
border:1px solid var(--line);
border-radius:10px;
cursor:pointer;
}

.addonLeft{
display:flex;
align-items:center;
gap:9px;
font-size:13px;
}

.addonLeft input{
width:18px;
height:18px;
margin:0;
accent-color:var(--accent);
}

.addonPrice{
font-size:12px;
font-weight:900;
color:var(--accent);
white-space:nowrap;
}

.qtyProduto{
display:flex;
align-items:center;
justify-content:center;
gap:20px;
margin:15px 0 20px;
}

.qtyProduto button{
width:42px;
height:42px;
border:0;
border-radius:10px;
background:#292930;
color:white;
font-size:24px;
cursor:pointer;
}

.qtyProduto button:last-child{
background:var(--accent);
color:#111;
}

.qtyProduto b{
font-size:21px;
min-width:30px;
text-align:center;
}

.addCart{
width:100%;
padding:15px;
border:0;
border-radius:12px;
background:var(--accent);
color:#111;
font-weight:900;
font-size:16px;
cursor:pointer;
}

@media(max-width:650px){

.grid{
grid-template-columns:1fr;
}

.search{
width:45vw;
}

.logo{
font-size:21px;
}

.cartbar{
padding:10px;
}

.checkout{
padding:12px;
}

.itemImage{
width:75px;
height:75px;
}

}

@media(min-width:651px){

.itemImage{
width:95px;
height:95px;
}

}

</style>

</head>

<button

</div>

/* =====================================================

===================================================== */

function BRL(n){

return Number(n).toLocaleString(
"pt-BR",
{
style:"currency",
currency:"BRL"
}
);

}


/* =====================================================

===================================================== */

function safe(text){

return String(text)
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'")
.replace(/"/g,"&quot;");

}

class="${c===active?"active":""}"
onclick="setCat('${safe(c)}')"
>
${c}
</button>

`).join("");

}

active=c;
render();

}

/* =====================================================
   TIPO
===================================================== */

function tipoProduto(produto){

const cat=produto.cat.toUpperCase();

if(
cat==="TRADICIONAL" ||
cat==="ARTESANAL"
){

return "hamburguer";

}

if(cat==="PORÇÕES"){

return "porcao";

}

if(cat==="AÇAÍ"){

return "acai";

}

if(cat==="MILKSHAKES"){

return "milkshake";

}

if(
cat==="PASTEL" ||
cat==="SOBREMESA"
){

return "sobremesa";

}

return null;

}

===================================================== */

function addById(name){

const produto=ITEMS.find(
i=>i.name===name
);

if(!produto){

return;

}

abrirProduto(produto);

}

);

function alterarQtdProduto(valor){

qtdProduto+=valor;

if(qtdProduto<1){

qtdProduto=1;

}

document.getElementById(
"produtoQtd"
).textContent=qtdProduto;

}

/* =====================================================
ADICIONAR
===================================================== */

function adicionarConfigurado(){

if(!produtoAtual){

return;

}

const selecionados=[
...document.querySelectorAll(
".produtoAddon:checked"
)
];

const adicionais=selecionados.map(a=>({

name:a.dataset.name,
price:Number(a.dataset.price)

}));

const obsEl=document.getElementById(
"produtoObs"
);

const obs=obsEl
?obsEl.value.trim()
:"";

const valorAdicionais=adicionais.reduce(
(s,a)=>s+a.price,
0
);

const preco=
produtoAtual.price+
valorAdicionais;

const chave=
produtoAtual.name+
"|" +
adicionais.map(a=>a.name).join(",")+
"|" +
obs;

if(!cart[chave]){

cart[chave]={

name:produtoAtual.name,

price:preco,

qty:0,

addons:adicionais,

obs:obs

};

}

cart[chave].qty+=qtdProduto;

produtoDlg.close();

produtoAtual=null;

qtdProduto=1;

update();

}

/* =====================================================
ATUALIZAR
===================================================== */

function update(){

const items=Object.values(cart);

const t=items.reduce(
(s,x)=>s+x.price*x.qty,
0
);

const c=items.reduce(
(s,x)=>s+x.qty,
0
);

total.textContent=BRL(t);

count.textContent=
`${c} ${c===1?"item":"itens"}`;

}

/* =====================================================
ALTERAR CARRINHO
===================================================== */

function change(key,d){

if(!cart[key]){

return;

}

cart[key].qty+=d;

if(cart[key].qty<=0){

delete cart[key];

}

update();

openCart();

}
