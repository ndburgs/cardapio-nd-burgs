<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ND BURGS — Cardápio</title>

<style>
:root{
--bg:#0b0b0d;
--card:#151519;
--line:#29292f;
--text:#fff;
--muted:#a8a8b0;
--accent:#ffc400;
--green:#25d366;
}

*{box-sizing:border-box}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:Arial,Helvetica,sans-serif;
}

header{
position:sticky;
top:0;
z-index:5;
background:rgba(11,11,13,.97);
border-bottom:1px solid var(--line);
padding:14px 16px;
}

.top{
max-width:1100px;
margin:auto;
display:flex;
gap:12px;
align-items:center;
justify-content:space-between;
}

.logo{
font-weight:900;
font-size:25px;
white-space:nowrap;
}

.logo span{
color:var(--accent);
}

.search{
width:min(430px,52vw);
background:#202025;
border:1px solid var(--line);
color:white;
border-radius:12px;
padding:12px 14px;
outline:0;
}

main{
max-width:1100px;
margin:auto;
padding:18px 16px 110px;
}

.cats{
display:flex;
gap:8px;
overflow:auto;
padding-bottom:12px;
}

.cats button{
white-space:nowrap;
border:1px solid var(--line);
background:#151519;
color:#ddd;
border-radius:999px;
padding:9px 13px;
font-weight:700;
}

.cats button.active{
background:var(--accent);
color:#111;
border-color:var(--accent);
}

h2{
font-size:20px;
margin:24px 0 10px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}

.item{
background:var(--card);
border:1px solid var(--line);
border-radius:14px;
padding:14px;
display:flex;
justify-content:space-between;
gap:10px;
min-height:92px;
}

.item h3{
font-size:15px;
margin:0 0 7px;
}

.cat{
color:var(--muted);
font-size:12px;
}

.price{
font-weight:900;
margin-top:7px;
}

.add{
align-self:center;
background:var(--accent);
border:0;
border-radius:10px;
padding:10px 15px;
font-weight:900;
font-size:18px;
}

.cartbar{
position:fixed;
left:0;
right:0;
bottom:0;
background:#111115;
border-top:1px solid var(--line);
padding:12px 16px;
z-index:10;
}

.cartbar>div{
max-width:1100px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}

.checkout{
background:var(--green);
border:0;
color:#071008;
font-weight:900;
border-radius:12px;
padding:13px 18px;
}

.count{
font-size:12px;
color:var(--muted);
}

dialog{
border:0;
border-radius:18px;
background:#17171c;
color:#fff;
width:min(560px,94vw);
padding:0;
box-shadow:0 20px 80px #000;
}

dialog::backdrop{
background:#000b;
}

.modal{
padding:20px;
}

.close{
float:right;
background:none;
border:0;
color:#aaa;
font-size:25px;
cursor:pointer;
}

.rows{
max-height:300px;
overflow:auto;
margin:12px 0;
}

.row{
display:flex;
justify-content:space-between;
gap:8px;
padding:12px 0;
border-bottom:1px solid var(--line);
}

.qty{
display:flex;
align-items:center;
gap:8px;
white-space:nowrap;
}

.qty button{
background:#292930;
color:white;
border:0;
border-radius:7px;
width:30px;
height:30px;
font-size:18px;
}

input,textarea,select{
width:100%;
margin:6px 0 10px;
background:#0f0f12;
border:1px solid var(--line);
color:white;
border-radius:10px;
padding:11px;
font-size:15px;
}

label{
font-size:13px;
font-weight:bold;
}

.send{
width:100%;
padding:14px;
border:0;
border-radius:12px;
background:var(--green);
font-weight:900;
font-size:16px;
cursor:pointer;
}

.empty{
color:var(--muted);
padding:25px 0;
text-align:center;
}

.trocoBox{
display:none;
}

.totalBox{
font-size:19px;
font-weight:900;
margin:10px 0 16px;
padding:12px;
background:#101014;
border-radius:10px;
}

@media(max-width:650px){

.grid{
grid-template-columns:1fr;
}

.search{
width:45vw;
}

.logo{
font-size:21px;
}

.cartbar{
padding:10px;
}

.checkout{
padding:12px;
}

}
</style>
</head>

<label>Complemento</label>

<label>Observação</label>

<textarea

</div>

function safe(text){

return String(text)
.replaceAll("\\","\\\\")
.replaceAll("'","\\'");

}


function renderCats(){

catsEl.innerHTML = cats.map(c=>`

<button
class="${c===active?'active':''}"
onclick="setCat('${safe(c)}')"
>
${c}
</button>

`).join('');

}


function setCat(c){

active=c;

render();

}


function render(){

renderCats();

const q =
search.value.toLowerCase().trim();

const filtered =
ITEMS.filter(x =>
(active==='TODOS'||x.cat===active)
&&
x.name.toLowerCase().includes(q)
);

const groups={};

filtered.forEach(x=>{
(groups[x.cat]??=[]).push(x);
});


menu.innerHTML =
Object.entries(groups).map(([cat,arr])=>`

<section>

<h2>${cat}</h2>

<div class="grid">

${arr.map(x=>`

<div class="item">

<div>

<h3>${x.name}</h3>

<div class="cat">
${x.cat}
</div>

<div class="price">
${BRL(x.price)}
</div>

</div>

<button
class="add"
onclick="addById('${safe(x.name)}')"
>
+
</button>

</div>

`).join('')}

</div>

</section>

`).join('')

||

'<div class="empty">Nenhum produto encontrado.</div>';

}


function addById(name){

const x =
ITEMS.find(i=>i.name===name);

if(!x)return;

add(x.name,x.price);

}


function add(name,price){

if(!cart[name]){

cart[name]={
name:name,
price:price,
qty:0
};

}

cart[name].qty++;

update();

}


function change(name,d){

if(!cart[name])return;

cart[name].qty+=d;

if(cart[name].qty<=0){

delete cart[name];

}

update();

openCart();

}


function update(){

const a =
Object.values(cart);

const t =
a.reduce(
(s,x)=>s+x.price*x.qty,
0
);

const c =
a.reduce(
(s,x)=>s+x.qty,
0
);

total.textContent =
BRL(t);

count.textContent =
`${c} ${c===1?'item':'itens'}`;

}


function openCart(){

const items =
Object.values(cart);

rows.innerHTML =
items.map(x=>`

<div>

<b>${x.name}</b>

<br>

<span class="count">
${BRL(x.price)} cada
</span>

</div>

<div class="qty">

<button
onclick="change('${safe(x.name)}',-1)"
>

</button>

<b>${x.qty}</b>

<button
onclick="change('${safe(x.name)}',1)"
>

</button>

</div>

</div>

`).join('')

dlg.showModal();

}
