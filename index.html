<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ND BURGS | Cardápio Online</title>

<style>
:root{
    --bg:#0b0b0d;
    --card:#151519;
    --card2:#1b1b20;
    --line:#29292f;
    --text:#fff;
    --muted:#a8a8b0;
    --yellow:#ffc400;
    --yellow2:#ffda32;
    --green:#25d366;
    --red:#e53935;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    padding-bottom:95px;
}

/* =========================================================
   TOPO
========================================================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(8,8,10,.97);
    backdrop-filter:blur(15px);
    border-bottom:1px solid var(--line);
}

.top{
    max-width:1150px;
    margin:auto;
    padding:12px 15px;
}

.logo-area{
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:12px;
}

.logo{
    width:145px;
    max-width:48vw;
    height:auto;
    display:block;
}

.search-box{
    position:relative;
}

.search{
    width:100%;
    background:#202025;
    border:1px solid #33333a;
    color:white;
    border-radius:14px;
    padding:14px 45px 14px 16px;
    font-size:15px;
    outline:none;
}

.search:focus{
    border-color:var(--yellow);
}

.search-icon{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    font-size:20px;
}

/* =========================================================
   CATEGORIAS
========================================================= */

.categories{
    max-width:1150px;
    margin:auto;
    padding:10px 15px 5px;
}

.cats{
    display:flex;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
    padding-bottom:5px;
}

.cats::-webkit-scrollbar{
    display:none;
}

.cat-btn{
    flex-shrink:0;
    border:1px solid #33333a;
    background:#151519;
    color:#ddd;
    border-radius:999px;
    padding:10px 14px;
    font-weight:bold;
    font-size:13px;
    cursor:pointer;
    transition:.2s;
}

.cat-btn.active{
    background:var(--yellow);
    border-color:var(--yellow);
    color:#111;
}

/* =========================================================
   CONTEÚDO
========================================================= */

main{
    width:100%;
    max-width:1150px;
    margin:auto;
    padding:10px 15px 110px;
}

.category-section{
    margin-top:25px;
    scroll-margin-top:155px;
}

.category-title{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:21px;
    margin-bottom:12px;
}

.category-title::after{
    content:"";
    height:1px;
    flex:1;
    background:var(--line);
}

/* =========================================================
   PRODUTOS
========================================================= */

.grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
}

.product{
    background:linear-gradient(145deg,#18181d,#121216);
    border:1px solid var(--line);
    border-radius:17px;
    padding:14px;
    min-height:130px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    box-shadow:0 5px 18px rgba(0,0,0,.18);
    transition:.18s;
}

.product:hover{
    border-color:#44444c;
    transform:translateY(-1px);
}

.product-info{
    min-width:0;
    flex:1;
}

.product-name{
    font-size:15px;
    line-height:1.25;
    font-weight:900;
    margin-bottom:7px;
}

.product-description{
    color:var(--muted);
    font-size:12px;
    line-height:1.4;
    min-height:17px;
}

.product-price{
    color:var(--yellow);
    font-size:17px;
    font-weight:900;
    margin-top:10px;
}

.add-button{
    align-self:flex-end;
    width:42px;
    height:42px;
    flex-shrink:0;
    border:none;
    border-radius:13px;
    background:var(--yellow);
    color:#111;
    font-size:25px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(255,196,0,.15);
}

.add-button:active{
    transform:scale(.93);
}

/* =========================================================
   CARRINHO FIXO
========================================================= */

.cart-bar{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:2000;
    background:rgba(17,17,21,.97);
    backdrop-filter:blur(12px);
    border-top:1px solid #303038;
    padding:10px 15px;
}

.cart-inner{
    max-width:1150px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.cart-total{
    font-size:18px;
    font-weight:900;
}

.cart-count{
    color:var(--muted);
    font-size:12px;
    margin-top:2px;
}

.cart-button{
    border:0;
    background:var(--green);
    color:#061008;
    border-radius:13px;
    padding:13px 18px;
    font-size:14px;
    font-weight:900;
    cursor:pointer;
}

/* =========================================================
   MODAL
========================================================= */

dialog{
    width:min(570px,94vw);
    max-height:92vh;
    border:1px solid #36363d;
    border-radius:22px;
    padding:0;
    background:#151519;
    color:white;
    box-shadow:0 25px 100px rgba(0,0,0,.75);
}

dialog::backdrop{
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(3px);
}

.modal{
    padding:20px;
    max-height:92vh;
    overflow-y:auto;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.modal-header h2{
    font-size:22px;
}

.close{
    width:36px;
    height:36px;
    border:0;
    border-radius:50%;
    background:#29292f;
    color:#fff;
    font-size:23px;
    cursor:pointer;
}

.cart-items{
    max-height:270px;
    overflow-y:auto;
    margin-bottom:15px;
}

.cart-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
}

.cart-row-name{
    flex:1;
    font-weight:bold;
    font-size:14px;
}

.cart-row-price{
    color:var(--yellow);
    font-weight:bold;
    font-size:13px;
}

.quantity{
    display:flex;
    align-items:center;
    gap:8px;
}

.quantity button{
    width:30px;
    height:30px;
    border:0;
    border-radius:8px;
    background:#303038;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.quantity .plus{
    background:var(--yellow);
    color:#111;
}

.summary{
    background:#101014;
    border:1px solid var(--line);
    border-radius:14px;
    padding:13px;
    margin:12px 0 18px;
}

.summary-line{
    display:flex;
    justify-content:space-between;
    padding:5px 0;
    color:#ddd;
}

.summary-total{
    display:flex;
    justify-content:space-between;
    border-top:1px solid #393940;
    margin-top:7px;
    padding-top:11px;
    font-size:21px;
    font-weight:900;
    color:var(--yellow);
}

.form-title{
    color:var(--yellow);
    font-size:17px;
    font-weight:900;
    margin:18px 0 10px;
}

label{
    display:block;
    color:#ddd;
    font-size:13px;
    font-weight:bold;
    margin:12px 0 6px;
}

input,
select,
textarea{
    width:100%;
    background:#0d0d10;
    border:1px solid #37373e;
    color:white;
    border-radius:11px;
    padding:13px;
    font-size:14px;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:var(--yellow);
}

textarea{
    resize:vertical;
    min-height:75px;
}

.delivery-type{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.type-option{
    background:#101014;
    border:1px solid #38383f;
    color:#ddd;
    border-radius:11px;
    padding:12px 5px;
    text-align:center;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
}

.type-option.active{
    background:var(--yellow);
    border-color:var(--yellow);
    color:#111;
}

.hidden{
    display:none!important;
}

.rate-notice{
    margin-top:8px;
    background:#292000;
    border:1px solid var(--yellow);
    color:var(--yellow);
    padding:11px;
    border-radius:10px;
    font-size:13px;
}

.send-button{
    width:100%;
    border:0;
    background:var(--green);
    color:#061008;
    border-radius:13px;
    padding:15px;
    margin-top:18px;
    font-size:16px;
    font-weight:900;
    cursor:pointer;
}

.clear-button{
    width:100%;
    border:0;
    background:#690000;
    color:white;
    border-radius:13px;
    padding:12px;
    margin-top:8px;
    font-weight:bold;
    cursor:pointer;
}

.empty{
    text-align:center;
    color:var(--muted);
    padding:25px 10px;
}

/* =========================================================
   DESTAQUE
========================================================= */

.hero{
    background:linear-gradient(135deg,#1c1c20,#101014);
    border:1px solid var(--line);
    border-radius:18px;
    padding:17px;
    margin:10px 0 5px;
}

.hero-title{
    color:var(--yellow);
    font-size:20px;
    font-weight:900;
}

.hero-text{
    color:var(--muted);
    margin-top:5px;
    font-size:13px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:650px){

    .top{
        padding:10px 12px;
    }

    .logo{
        width:125px;
    }

    main{
        padding-left:12px;
        padding-right:12px;
    }

    .categories{
        padding-left:12px;
        padding-right:12px;
    }

    .grid{
        grid-template-columns:1fr;
        gap:9px;
    }

    .product{
        min-height:112px;
    }

    .product-name{
        font-size:15px;
    }

    .product-price{
        font-size:16px;
    }

    .cart-button{
        padding:12px 14px;
    }

    .cart-total{
        font-size:16px;
    }

    .delivery-type{
        grid-template-columns:1fr 1fr 1fr;
    }
}

@media(min-width:900px){

    .grid{
        grid-template-columns:repeat(3,minmax(0,1fr));
    }
}
</style>
</head>

<!-- =========================================================
     HEADER
========================================================= -->

<header>

    <div class="top">

        <div class="logo-area">

            <img
                class="logo"
                src="https://i.ibb.co/5gsVbBcb/corretooo.jpg"

            >

        </div>

        <div class="search-box">

            <input
                id="search"
                class="search"
                type="text"
                placeholder="🔎 Buscar no cardápio..."
                autocomplete="off"
            >

            <span class="search-icon">🍔</span>

        </div>

    </div>

</header>


<!-- =========================================================
     CATEGORIAS
========================================================= -->

<div class="categories">

    <div id="categories" class="cats"></div>

</div>


<!-- =========================================================
     CARDÁPIO
========================================================= -->

<main>

    <div class="hero">

        <div class="hero-title">
            🍔 ND BURGS
        </div>

        <div class="hero-text">
            Escolha seus favoritos, monte seu pedido e receba em casa.
        </div>

    </div>

    <div id="menu"></div>

</main>


<!-- =========================================================
     CARRINHO FIXO
========================================================= -->

<div class="cart-bar">

    <div class="cart-inner">

        <div>

            <div
                id="cartTotal"
                class="cart-total"
            >
                R$ 0,00
            </div>

            <div
                id="cartCount"
                class="cart-count"
            >
                0 itens
            </div>

        </div>

        <button
            class="cart-button"
            onclick="abrirCarrinho()"
        >
            🛒 VER CARRINHO
        </button>

    </div>

</div>


<!-- =========================================================
     MODAL CARRINHO
========================================================= -->

<dialog id="cartDialog">

    <div class="modal">

        <div class="modal-header">

            <h2>🛒 Seu pedido</h2>

            <button
                class="close"
                onclick="cartDialog.close()"
            >
                ×
            </button>

        </div>


        <div
            id="cartItems"
            class="cart-items"
        ></div>


        <div class="summary">

            <div class="summary-line">

                <span>Subtotal</span>

                <strong id="modalSubtotal">
                    R$ 0,00
                </strong>

            </div>

            <div class="summary-line">

                <span>Taxa de entrega</span>

                <strong id="modalTaxa">
                    R$ 0,00
                </strong>

            </div>

            <div class="summary-total">

                <span>TOTAL</span>

                <span id="modalTotal">
                    R$ 0,00
                </span>

            </div>

        </div>


        <!-- =================================================
             DADOS
        ================================================= -->

        <div class="form-title">
            📍 Dados do pedido
        </div>


        <label>
            Nome *
        </label>

        <input
            id="nome"
            type="text"
            placeholder="Digite seu nome"
            autocomplete="name"
        >


        <label>
            WhatsApp *
        </label>

        <input
            id="telefone"
            type="tel"
            placeholder="(11) 99999-9999"
            autocomplete="tel"
        >


        <label>
            Tipo do pedido *
        </label>

        <div class="delivery-type">

            <button
                type="button"
                id="tipoEntrega"
                class="type-option active"
                onclick="selecionarTipo('ENTREGA')"
            >
                🚚<br>
                ENTREGA
            </button>

            <button
                type="button"
                id="tipoRetirada"
                class="type-option"
                onclick="selecionarTipo('RETIRADA')"
            >
                🛍️<br>
                RETIRADA
            </button>

            <button
                type="button"
                id="tipoBalcao"
                class="type-option"
                onclick="selecionarTipo('BALCAO')"
            >
                🏪<br>
                BALCÃO
            </button>

        </div>


        <!-- ENDEREÇO -->

        <div id="addressArea">

            <label>
                Rua *
            </label>

            <select
                id="rua"
                onchange="calcularTaxa()"
            >

                <option value="">
                    Selecione sua rua
                </option>

            </select>


            <label>
                Número *
            </label>

            <input
                id="numero"
                type="text"
                placeholder="Número da residência"
            >


            <label>
                Complemento
            </label>

            <input
                id="complemento"
                type="text"
                placeholder="Casa, apartamento, referência..."
            >


            <div
                id="rateNotice"
                class="rate-notice hidden"
            ></div>

        </div>


        <!-- PAGAMENTO -->

        <label>
            Forma de pagamento *
        </label>

        <select
            id="pagamento"
            onchange="verTroco()"
        >

            <option value="">
                Selecione
            </option>

            <option value="PIX">
                PIX
            </option>

            <option value="DINHEIRO">
                DINHEIRO
            </option>

            <option value="CARTÃO">
                CARTÃO
            </option>

            <option value="IFOOD">
                IFOOD
            </option>

            <option value="99FOOD">
                99FOOD
            </option>

        </select>


        <div
            id="trocoArea"
            class="hidden"
        >

            <label>
                Troco para quanto?
            </label>

            <input
                id="troco"
                type="text"
                inputmode="decimal"
                placeholder="Ex.: 50,00"
            >

        </div>


        <!-- OBSERVAÇÃO -->

        <label>
            Observação
        </label>

        <textarea
            id="observacao"
            placeholder="Ex.: sem cebola, tocar campainha..."
        ></textarea>


        <button
            class="send-button"
            onclick="finalizarPedido()"
        >
            📲 ENVIAR PEDIDO PELO WHATSAPP
        </button>


        <button
            class="clear-button"
            onclick="limparCarrinho()"
        >
            🗑️ LIMPAR CARRINHO
        </button>

    </div>

</dialog>

/* =========================================================
   ESTADO
========================================================= */

let carrinho = {};

let tipoPedido = "ENTREGA";


/* =========================================================
   ELEMENTOS
========================================================= */

const categoriesEl =
    document.getElementById("categories");

const menuEl =
    document.getElementById("menu");

const searchEl =
    document.getElementById("search");

const cartDialog =
    document.getElementById("cartDialog");


/* =========================================================
   MOEDA
========================================================= */

function BRL(valor){

    return Number(valor).toLocaleString(
        "pt-BR",
        {
            style:"currency",
            currency:"BRL"
        }
    );

}


/* =========================================================
   CATEGORIAS
========================================================= */

function renderCategorias(){

    categoriesEl.innerHTML =

        `<button
            class="cat-btn active"
            onclick="mostrarCategoria('TODOS',this)"
        >
            🏠 Todos
        </button>`

        +

        CATEGORIAS.map(cat => `

            <button
                class="cat-btn"
                onclick="mostrarCategoria('${cat.id}',this)"
            >
                ${cat.nome}
            </button>

        `).join("");

}


/* =========================================================
   RENDER CARDÁPIO
========================================================= */

function renderMenu(filtroCategoria="TODOS"){

    const busca =
        searchEl.value
        .trim()
        .toLowerCase();

    let produtos =
        ITEMS.filter(item => {

            const categoriaOk =
                filtroCategoria === "TODOS"
                ||
                item.cat === filtroCategoria;

            const buscaOk =
                !busca
                ||
                item.name
                    .toLowerCase()
                    .includes(busca);

            return categoriaOk && buscaOk;

        });


    if(produtos.length === 0){

        menuEl.innerHTML = `

            <div class="empty">

                😕<br><br>

                Nenhum produto encontrado.

            </div>

        `;

        return;

    }


    let html = "";


    if(filtroCategoria === "TODOS"){

        CATEGORIAS.forEach(cat => {

            const lista =
                produtos.filter(
                    x => x.cat === cat.id
                );

            if(!lista.length) return;


            html += `

                <section
                    id="cat-${cat.id}"
                    class="category-section"
                >

                    <h2 class="category-title">
                        ${cat.nome}
                    </h2>

                    <div class="grid">

                        ${lista
                            .map(produtoCard)
                            .join("")}

                    </div>

                </section>

            `;

        });

    }else{

        const cat =
            CATEGORIAS.find(
                x => x.id === filtroCategoria
            );

        html = `

            <section class="category-section">

                <h2 class="category-title">
                    ${cat ? cat.nome : filtroCategoria}
                </h2>

                <div class="grid">

                    ${produtos
                        .map(produtoCard)
                        .join("")}

                </div>

            </section>

        `;

    }


    menuEl.innerHTML = html;

}


/* =========================================================
   CARD PRODUTO
========================================================= */

function produtoCard(item){

    const descricao =
        item.desc
        ||
        "Produto ND BURGS.";


    return `

        <article class="product">

            <div class="product-info">

                <div class="product-name">
                    ${item.name}
                </div>

                <div class="product-description">
                    ${descricao}
                </div>

                <div class="product-price">
                    ${BRL(item.price)}
                </div>

            </div>

            <button
                class="add-button"
                onclick="adicionar('${escapeJS(item.name)}')"
                aria-label="Adicionar ${item.name}"
            >
                +
            </button>

        </article>

    `;

}


/* =========================================================
   ESCAPAR TEXTO
========================================================= */

function escapeJS(text){

    return text
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");

}


/* =========================================================
   MOSTRAR CATEGORIA
========================================================= */

function mostrarCategoria(categoria,botao){

    document
        .querySelectorAll(".cat-btn")
        .forEach(btn =>
            btn.classList.remove("active")
        );

    botao.classList.add("active");

    renderMenu(categoria);

}


/* =========================================================
   ADICIONAR
========================================================= */

function adicionar(nome){

    const produto =
        ITEMS.find(
            x => x.name === nome
        );

    if(!produto) return;


    if(!carrinho[nome]){

        carrinho[nome] = {

            name:produto.name,
            price:produto.price,
            qty:0

        };

    }


    carrinho[nome].qty++;

    atualizarCarrinho();

}


/* =========================================================
   ALTERAR QUANTIDADE
========================================================= */

function alterarQuantidade(nome,delta){

    if(!carrinho[nome]) return;


    carrinho[nome].qty += delta;


    if(carrinho[nome].qty <= 0){

        delete carrinho[nome];

    }


    atualizarCarrinho();

    abrirCarrinho();

}


/* =========================================================
   CALCULAR SUBTOTAL
========================================================= */

function calcularSubtotal(){

    return Object.values(carrinho)
        .reduce(
            (soma,item) =>
                soma + item.price * item.qty,
            0
        );

}


/* =========================================================
   TAXA
========================================================= */

function obterTaxa(){

    if(tipoPedido !== "ENTREGA"){

        return 0;

    }


    const rua =
        document.getElementById("rua").value;


    if(!rua) return 0;


    return TAXAS[rua] || 0;

}


/* =========================================================
   CALCULAR TAXA
========================================================= */

function calcularTaxa(){

    const taxa =
        obterTaxa();


    const notice =
        document.getElementById("rateNotice");


    const rua =
        document.getElementById("rua").value;


    if(tipoPedido === "ENTREGA" && rua){

        notice.classList.remove("hidden");

        notice.innerHTML =

            `🚚 Taxa para <strong>${rua}</strong>:
            <strong>${BRL(taxa)}</strong>`;

    }else{

        notice.classList.add("hidden");

    }


    atualizarResumo();

}


/* =========================================================
   RESUMO
========================================================= */

function atualizarResumo(){

    const subtotal =
        calcularSubtotal();

    const taxa =
        obterTaxa();

    const total =
        subtotal + taxa;


    document.getElementById("modalSubtotal")
        .textContent = BRL(subtotal);

    document.getElementById("modalTaxa")
        .textContent = BRL(taxa);

    document.getElementById("modalTotal")
        .textContent = BRL(total);

}


/* =========================================================
   ATUALIZAR BARRA
========================================================= */

function atualizarCarrinho(){

    const itens =
        Object.values(carrinho);

    const quantidade =
        itens.reduce(
            (soma,item) =>
                soma + item.qty,
            0
        );

    const subtotal =
        calcularSubtotal();


    document.getElementById("cartTotal")
        .textContent = BRL(subtotal);

    document.getElementById("cartCount")
        .textContent =
            `${quantidade} ${
                quantidade === 1
                ? "item"
                : "itens"
            }`;

}


/* =========================================================
   ABRIR CARRINHO
========================================================= */

function abrirCarrinho(){

    renderCarrinho();

    atualizarResumo();

    cartDialog.showModal();

}


/* =========================================================
   RENDER CARRINHO
========================================================= */

function renderCarrinho(){

    const area =
        document.getElementById("cartItems");

    const itens =
        Object.values(carrinho);


    if(!itens.length){

        area.innerHTML = `

            <div class="empty">

                🛒<br><br>

                Seu carrinho está vazio.<br>

                Adicione produtos ao seu pedido.

            </div>

        `;

        return;

    }


    area.innerHTML =

        itens.map(item => `

            <div class="cart-row">

                <div class="cart-row-name">

                    ${item.name}

                    <div class="cart-row-price">

                        ${BRL(item.price)}
                        cada

                    </div>

                </div>

                <div class="quantity">

                    <button
                        onclick="alterarQuantidade(
                            '${escapeJS(item.name)}',
                            -1
                        )"
                    >
                        −
                    </button>

                    <strong>
                        ${item.qty}
                    </strong>

                    <button
                        class="plus"
                        onclick="alterarQuantidade(
                            '${escapeJS(item.name)}',
                            1
                        )"
                    >
                        +
                    </button>

                </div>

            </div>

        `).join("");

}


/* =========================================================
   TIPO PEDIDO
========================================================= */

function selecionarTipo(tipo){

    tipoPedido = tipo;


    document
        .querySelectorAll(".type-option")
        .forEach(btn =>
            btn.classList.remove("active")
        );


    if(tipo === "ENTREGA"){

        document
            .getElementById("tipoEntrega")
            .classList.add("active");

        document
            .getElementById("addressArea")
            .classList.remove("hidden");

    }


    if(tipo === "RETIRADA"){

        document
            .getElementById("tipoRetirada")
            .classList.add("active");

        document
            .getElementById("addressArea")
            .classList.add("hidden");

    }


    if(tipo === "BALCAO"){

        document
            .getElementById("tipoBalcao")
            .classList.add("active");

        document
            .getElementById("addressArea")
            .classList.add("hidden");

    }


    calcularTaxa();

}


/* =========================================================
   TROCO
========================================================= */

function verTroco(){

    const pagamento =
        document.getElementById("pagamento")
        .value;


    const area =
        document.getElementById("trocoArea");


    if(pagamento === "DINHEIRO"){

        area.classList.remove("hidden");

    }else{

        area.classList.add("hidden");

    }

}


/* =========================================================
   CARREGAR RUAS
========================================================= */

function carregarRuas(){

    const select =
        document.getElementById("rua");


    const ruas =
        Object.keys(TAXAS)
            .sort((a,b) =>
                a.localeCompare(
                    b,
                    "pt-BR"
                )
            );


    ruas.forEach(rua => {

        const option =
            document.createElement("option");


        option.value = rua;


        option.textContent =
            `${rua} — ${BRL(TAXAS[rua])}`;


        select.appendChild(option);

    });

}


/* =========================================================
   LIMPAR CARRINHO
========================================================= */

function limparCarrinho(){

    if(!Object.keys(carrinho).length){

        alert(
            "Seu carrinho já está vazio."
        );

        return;

    }


    if(
        !confirm(
            "Deseja realmente limpar o carrinho?"
        )
    ){

        return;

    }


    carrinho = {};

    atualizarCarrinho();

    renderCarrinho();

    atualizarResumo();

}


/* =========================================================
   FINALIZAR PEDIDO
========================================================= */

function finalizarPedido(){

    const itens =
        Object.values(carrinho);


    if(!itens.length){

        alert(
            "Adicione pelo menos um produto ao carrinho."
        );

        return;

    }


    const nome =
        document.getElementById("nome")
            .value.trim();


    const telefone =
        document.getElementById("telefone")
            .value.trim();


    const pagamento =
        document.getElementById("pagamento")
            .value;


    const observacao =
        document.getElementById("observacao")
            .value.trim();


    const troco =
        document.getElementById("troco")
            .value.trim();


    if(!nome){

        alert("Digite seu nome.");

        return;

    }


    if(!telefone){

        alert("Digite seu WhatsApp.");

        return;

    }


    if(tipoPedido === "ENTREGA"){

        const rua =
            document.getElementById("rua")
                .value;


        const numero =
            document.getElementById("numero")
                .value.trim();


        if(!rua){

            alert(
                "Selecione sua rua."
            );

            return;

        }


        if(!numero){

            alert(
                "Digite o número da residência."
            );

            return;

        }

    }


    if(!pagamento){

        alert(
            "Selecione a forma de pagamento."
        );

        return;

    }


    if(
        pagamento === "DINHEIRO"
        &&
        !troco
    ){

        alert(
            "Informe o valor para o troco."
        );

        return;

    }


    const subtotal =
        calcularSubtotal();


    const taxa =
        obterTaxa();


    const total =
        subtotal + taxa;


    let mensagem = "";


    mensagem +=
        "🍔 *NOVO PEDIDO — ND BURGS*\n";

    mensagem +=
        "━━━━━━━━━━━━━━━━━━\n\n";


    mensagem +=
        "👤 *CLIENTE:*\n";

    mensagem +=
        nome + "\n\n";


    mensagem +=
        "📱 *WHATSAPP:*\n";

    mensagem +=
        telefone + "\n\n";


    mensagem +=
        "📦 *TIPO DO PEDIDO:*\n";

    mensagem +=
        tipoPedido === "ENTREGA"
        ? "ENTREGA"
        : tipoPedido === "RETIRADA"
        ? "RETIRADA"
        : "BALCÃO";


    mensagem += "\n";


    if(tipoPedido === "ENTREGA"){

        const rua =
            document.getElementById("rua")
                .value;


        const numero =
            document.getElementById("numero")
                .value.trim();


        const complemento =
            document.getElementById("complemento")
                .value.trim();


        mensagem +=
            "\n\n📍 *ENDEREÇO:*\n";

        mensagem +=
            rua +
            ", Nº " +
            numero;


        if(complemento){

            mensagem +=
                "\n🏠 *COMPLEMENTO:*\n" +
                complemento;

        }

    }


    mensagem +=
        "\n\n━━━━━━━━━━━━━━━━━━\n";

    mensagem +=
        "🛒 *ITENS DO PEDIDO*\n";

    mensagem +=
        "━━━━━━━━━━━━━━━━━━\n";


    itens.forEach(item => {

        const totalItem =
            item.price * item.qty;


        mensagem +=
            `${item.qty}x ${item.name} — ${BRL(totalItem)}\n`;

    });


    mensagem +=
        "\n━━━━━━━━━━━━━━━━━━\n";


    mensagem +=
        `💰 *SUBTOTAL:* ${BRL(subtotal)}\n`;


    mensagem +=
        `🚚 *TAXA:* ${BRL(taxa)}\n`;


    mensagem +=
        `💵 *TOTAL:* ${BRL(total)}\n\n`;


    mensagem +=
        "💳 *PAGAMENTO:*\n" +
        pagamento;


    if(
        pagamento === "DINHEIRO"
        &&
        troco
    ){

        mensagem +=
            "\n\n💵 *TROCO PARA:*\n" +
            troco;

    }


    mensagem +=
        "\n\n📝 *OBSERVAÇÃO:*\n";


    mensagem +=
        observacao ||
        "Nenhuma";


    mensagem +=
        "\n\n━━━━━━━━━━━━━━━━━━\n";

    mensagem +=
        "🍔 *Pedido realizado pelo Cardápio Online ND BURGS*";


    const url =
        "https://wa.me/" +
        WHATSAPP +
        "?text=" +
        encodeURIComponent(mensagem);


    window.open(
        url,
        "_blank"
    );

}

   BUSCA
========================================================= */

searchEl.addEventListener(
    "input",
    function(){

        renderMenu("TODOS");


        document
            .querySelectorAll(".cat-btn")
            .forEach(btn =>
                btn.classList.remove("active")
            );


        document
            .querySelector(".cat-btn")
            .classList.add("active");

    }
);


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

renderCategorias();

carregarRuas();

renderMenu();

atualizarCarrinho();

</script>
