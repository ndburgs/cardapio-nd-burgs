<!DOCTYPE html>
<html lang="pt-BR">

<title>ND BURGS | Faça seu pedido</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    color:#171717;
    padding-bottom:100px;
}

/* ================= HEADER ================= */

header{
    background:#000;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 2px 15px rgba(0,0,0,.3);
}

.header-top{
    height:72px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px 15px;
}

.logo{
    height:55px;
    max-width:180px;
    object-fit:contain;
}

/* ================= CATEGORIAS ================= */

.categorias{
    background:#000;
    border-top:1px solid #292929;
    overflow-x:auto;
    white-space:nowrap;
    scrollbar-width:none;
}

.categorias::-webkit-scrollbar{
    display:none;
}

.categorias-inner{
    display:flex;
    gap:8px;
    padding:10px 12px;
}

.cat-btn{
    border:none;
    background:#1d1d1d;
    color:#fff;
    border-radius:25px;
    padding:10px 15px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
    white-space:nowrap;
}

.cat-btn.ativo{
    background:#f5c400;
    color:#000;
}

/* ================= CONTAINER ================= */

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:12px;
}

.banner{
    background:#111;
    color:#fff;
    border-radius:15px;
    padding:20px;
    margin:10px 0 18px;
    position:relative;
    overflow:hidden;
}

.banner h1{
    color:#f5c400;
    font-size:25px;
    margin-bottom:6px;
}

.banner p{
    color:#ddd;
    font-size:14px;
}

/* ================= BUSCA ================= */

.busca{
    position:relative;
    margin-bottom:18px;
}

.busca input{
    width:100%;
    padding:15px 18px 15px 45px;
    border:1px solid #ddd;
    border-radius:13px;
    background:#fff;
    color:#222;
    font-size:15px;
    outline:none;
}

.busca span{
    position:absolute;
    left:16px;
    top:14px;
    font-size:19px;
}

/* ================= CATEGORIA ================= */

.secao{
    margin-bottom:28px;
    scroll-margin-top:135px;
}

.titulo-categoria{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:21px;
    margin:20px 0 12px;
}

.titulo-categoria::after{
    content:"";
    flex:1;
    height:1px;
    background:#ddd;
}

/* ================= PRODUTOS ================= */

.produtos{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.produto{
    background:#fff;
    border-radius:14px;
    overflow:hidden;
    border:1px solid #e6e6e6;
    box-shadow:0 2px 7px rgba(0,0,0,.07);
    display:flex;
    flex-direction:column;
}

.produto-img{
    width:100%;
    height:180px;
    object-fit:cover;
    background:#eee;
}

.produto-sem-foto{
    width:100%;
    height:180px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#191919;
    color:#f5c400;
    font-size:45px;
}

.produto-info{
    padding:12px;
    display:flex;
    flex-direction:column;
    flex:1;
}

.produto h3{
    font-size:16px;
    line-height:1.2;
    margin-bottom:6px;
}

.descricao{
    color:#777;
    font-size:12px;
    line-height:1.35;
    min-height:32px;
}

.preco{
    color:#111;
    font-size:17px;
    font-weight:bold;
    margin:10px 0;
}

.btn-add{
    width:100%;
    border:0;
    border-radius:9px;
    padding:11px;
    background:#f5c400;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}

.btn-add:active{
    transform:scale(.97);
}

/* ================= CARRINHO FLUTUANTE ================= */

.botao-carrinho{
    position:fixed;
    right:18px;
    bottom:18px;
    z-index:2000;
    border:0;
    background:#f5c400;
    color:#000;
    width:62px;
    height:62px;
    border-radius:50%;
    font-size:25px;
    cursor:pointer;
    box-shadow:0 5px 20px rgba(0,0,0,.3);
}

.contador{
    position:absolute;
    top:-4px;
    right:-3px;
    background:#e00000;
    color:#fff;
    width:24px;
    height:24px;
    border-radius:50%;
    font-size:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

/* ================= PAINEL CARRINHO ================= */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:3000;
    display:none;
}

.overlay.aberto{
    display:block;
}

.carrinho-painel{
    position:absolute;
    right:0;
    top:0;
    height:100%;
    width:100%;
    max-width:470px;
    background:#f7f7f7;
    display:flex;
    flex-direction:column;
}

.carrinho-header{
    background:#000;
    color:#fff;
    padding:17px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.carrinho-header h2{
    color:#f5c400;
    font-size:20px;
}

.fechar{
    border:0;
    background:#333;
    color:#fff;
    width:35px;
    height:35px;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

.carrinho-conteudo{
    flex:1;
    overflow-y:auto;
    padding:14px;
}

.carrinho-vazio{
    text-align:center;
    color:#888;
    padding:50px 20px;
}

.item-carrinho{
    background:#fff;
    border-radius:12px;
    padding:12px;
    margin-bottom:10px;
    border:1px solid #ddd;
}

.item-topo{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.item-nome{
    font-weight:bold;
    font-size:14px;
}

.item-preco{
    font-weight:bold;
}

.item-controles{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:10px;
}

.item-controles button{
    border:0;
    width:32px;
    height:32px;
    border-radius:8px;
    background:#f5c400;
    font-weight:bold;
    cursor:pointer;
}

.item-controles .excluir{
    background:#c62828;
    color:#fff;
    margin-left:auto;
}

.resumo{
    background:#fff;
    border-top:1px solid #ddd;
    padding:15px;
}

.linha{
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    font-size:14px;
}

.total{
    border-top:1px solid #ddd;
    margin-top:8px;
    padding-top:12px;
    font-size:21px;
    font-weight:bold;
}

.total strong{
    color:#168000;
}

/* ================= FORM ================= */

.formulario{
    background:#fff;
    border-radius:15px;
    padding:17px;
    margin-top:18px;
    border:1px solid #ddd;
}

.formulario h2{
    font-size:20px;
    margin-bottom:15px;
}

label{
    display:block;
    font-weight:bold;
    font-size:13px;
    margin:13px 0 6px;
}

input,
select,
textarea{
    width:100%;
    padding:13px;
    border-radius:9px;
    border:1px solid #ccc;
    background:#fafafa;
    color:#222;
    font-size:14px;
    outline:none;
}

textarea{
    min-height:80px;
    resize:vertical;
}

.endereco-extra{
    display:none;
}

.aviso-taxa{
    display:none;
    margin-top:10px;
    padding:11px;
    background:#fff8d5;
    border:1px solid #f5c400;
    border-radius:8px;
    color:#765d00;
    font-size:13px;
}

.btn-whatsapp{
    width:100%;
    border:0;
    border-radius:10px;
    padding:15px;
    background:#25d366;
    color:#fff;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
    margin-top:18px;
}

.btn-limpar{
    width:100%;
    border:0;
    border-radius:10px;
    padding:12px;
    background:#ddd;
    color:#555;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

/* ================= RODAPÉ ================= */

footer{
    text-align:center;
    color:#888;
    padding:35px 15px;
    font-size:13px;
}

/* ================= DESKTOP ================= */

@media(min-width:700px){

    .produtos{
        grid-template-columns:repeat(3,1fr);
    }

    .produto-img,
    .produto-sem-foto{
        height:200px;
    }

    .container{
        padding:18px;
    }
}

/* ================= MOBILE ================= */

@media(max-width:500px){

    .produto-img,
    .produto-sem-foto{
        height:145px;
    }

    .produto-info{
        padding:10px;
    }

    .produto h3{
        font-size:14px;
    }

    .preco{
        font-size:16px;
    }

    .btn-add{
        font-size:12px;
        padding:10px 5px;
    }

    .banner h1{
        font-size:21px;
    }
}
</style>

            <option value="IFOOD">IFOOD</option>

/* ============================================================
   CARRINHO
   ============================================================ */

let carrinho=[];


/* Recupera carrinho salvo */

try{

    carrinho=
        JSON.parse(localStorage.getItem("ndburgs_carrinho")) || [];

}catch(e){

    carrinho=[];

}


/* ============================================================
   MOEDA
   ============================================================ */

function moeda(valor){

    return Number(valor).toLocaleString("pt-BR",{
        style:"currency",
        currency:"BRL"
    });

}


/* ============================================================
   SALVAR CARRINHO
   ============================================================ */

function salvarCarrinho(){

    localStorage.setItem(
        "ndburgs_carrinho",
        JSON.stringify(carrinho)
    );

}


/* ============================================================
   RENDERIZAR PRODUTOS
   ============================================================ */

function renderizarProdutos(lista=produtos){

    const area=
        document.getElementById("produtosArea");

    area.innerHTML="";

    const agrupados={};

    lista.forEach(produto=>{

        if(!agrupados[produto.cat]){
            agrupados[produto.cat]=[];
        }

        agrupados[produto.cat].push(produto);

    });


    Object.keys(categorias).forEach(cat=>{

        if(!agrupados[cat] ||
           agrupados[cat].length===0){

            return;

        }


        const secao=
            document.createElement("section");

        secao.className="secao";
        secao.id=cat;


        const titulo=
            document.createElement("h2");

        titulo.className="titulo-categoria";

        titulo.innerText=
            categorias[cat];


        secao.appendChild(titulo);


        const grid=
            document.createElement("div");

        grid.className="produtos";


        agrupados[cat].forEach(produto=>{

            const card=
                document.createElement("div");

            card.className="produto";


            let imagem="";

            if(produto.img){

                imagem=`
                    <img
                        class="produto-img"
                        src="${produto.img}"
                        alt="${produto.nome}"
                        loading="lazy"
                        onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
                    >
                    <div
                        class="produto-sem-foto"
                        style="display:none;"
                    >
                        🍔
                    </div>
                `;

            }else{

                imagem=`
                    <div class="produto-sem-foto">
                        🍔
                    </div>
                `;

            }


            card.innerHTML=`

                ${imagem}

                <div class="produto-info">

                    <h3>
                        ${produto.nome}
                    </h3>

                    <div class="descricao">
                        ${produto.desc || "Produto ND BURGS."}
                    </div>

                    <div class="preco">
                        ${moeda(produto.preco)}
                    </div>

                    <button
                        class="btn-add"
                        onclick="adicionar('${escapar(produto.nome)}',${produto.preco})"
                    >
                        + ADICIONAR
                    </button>

                </div>

            `;


            grid.appendChild(card);

        });


        secao.appendChild(grid);

        area.appendChild(secao);

    });

}


/* ============================================================
   ESCAPAR TEXTO
   ============================================================ */

function escapar(texto){

    return texto
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");

}


/* ============================================================
   ADICIONAR
   ============================================================ */

function adicionar(nome,preco){

    const existente=
        carrinho.find(
            item=>item.nome===nome
        );


    if(existente){

        existente.quantidade++;

    }else{

        carrinho.push({

            nome:nome,
            preco:Number(preco),
            quantidade:1

        });

    }


    salvarCarrinho();

    atualizarCarrinho();

    /* Pequena indicação visual */

    abrirCarrinho();

}


/* ============================================================
   ALTERAR QUANTIDADE
   ============================================================ */

function alterarQuantidade(index,valor){

    if(!carrinho[index]) return;


    carrinho[index].quantidade+=valor;


    if(carrinho[index].quantidade<=0){

        carrinho.splice(index,1);

    }


    salvarCarrinho();

    atualizarCarrinho();

}


/* ============================================================
   REMOVER
   ============================================================ */

function removerItem(index){

    carrinho.splice(index,1);

    salvarCarrinho();

    atualizarCarrinho();

}


/* ============================================================
   ATUALIZAR CARRINHO
   ============================================================ */

function atualizarCarrinho(){

    const area=
        document.getElementById("carrinhoItens");

    area.innerHTML="";


    if(carrinho.length===0){

        area.innerHTML=`

            <div class="carrinho-vazio">

                🛒<br><br>

                <strong>
                    Seu carrinho está vazio.
                </strong>

                <br><br>

                Escolha seus produtos no cardápio.

            </div>

        `;

    }


    let subtotal=0;
    let quantidadeTotal=0;


    carrinho.forEach((item,index)=>{

        const totalItem=
            item.preco*item.quantidade;

        subtotal+=totalItem;

        quantidadeTotal+=
            item.quantidade;


        area.innerHTML+=`

            <div class="item-carrinho">

                <div class="item-topo">

                    <div class="item-nome">
                        ${item.nome}
                    </div>

                    <div class="item-preco">
                        ${moeda(totalItem)}
                    </div>

                </div>

                <div
                    style="
                    font-size:12px;
                    color:#888;
                    margin-top:4px;
                    "
                >
                    ${moeda(item.preco)} cada
                </div>

                <div class="item-controles">

                    <button
                        onclick="alterarQuantidade(${index},-1)"
                    >
                        −
                    </button>

                    <strong>
                        ${item.quantidade}
                    </strong>

                    <button
                        onclick="alterarQuantidade(${index},1)"
                    >
                        +
                    </button>

                    <button
                        class="excluir"
                        onclick="removerItem(${index})"
                    >
                        🗑
                    </button>

                </div>

            </div>

        `;

    });


    document.getElementById("subtotal").innerText=
        moeda(subtotal);


    document.getElementById("contadorCarrinho").innerText=
        quantidadeTotal;


    calcularTaxa();

}


/* ============================================================
   CALCULAR TAXA
   ============================================================ */

function calcularTaxa(){

    const tipo=
        document.getElementById("tipoPedido").value;

    let taxa=0;


    if(tipo==="ENTREGA"){

        const rua=
            document.getElementById("rua").value;

        if(rua && taxas[rua]!==undefined){

            taxa=Number(taxas[rua]);

        }

    }


    const subtotal=
        carrinho.reduce(
            (soma,item)=>
                soma+
                item.preco*item.quantidade,
            0
        );


    const total=
        subtotal+taxa;


    document.getElementById("taxa").innerText=
        moeda(taxa);


    document.getElementById("total").innerText=
        moeda(total);


    const aviso=
        document.getElementById("avisoTaxa");


    const rua=
        document.getElementById("rua").value;


    if(tipo==="ENTREGA" && rua){

        aviso.style.display="block";

        aviso.innerHTML=
            "🚚 Taxa de entrega para <strong>"+
            rua+
            "</strong>: <strong>"+
            moeda(taxa)+
            "</strong>";

    }else{

        aviso.style.display="none";

    }

}


/* ============================================================
   TIPO DO PEDIDO
   ============================================================ */

function alterarTipoPedido(){

    const tipo=
        document.getElementById("tipoPedido").value;

    const area=
        document.getElementById("enderecoArea");


    if(tipo==="ENTREGA"){

        area.style.display="block";

    }else{

        area.style.display="none";

    }


    calcularTaxa();

}


/* ============================================================
   PAGAMENTO
   ============================================================ */

function verificarPagamento(){

    const pagamento=
        document.getElementById("pagamento").value;

    const area=
        document.getElementById("trocoArea");


    if(pagamento==="DINHEIRO"){

        area.style.display="block";

    }else{

        area.style.display="none";

    }

}


/* ============================================================
   CARREGAR RUAS
   ============================================================ */

function carregarRuas(){

    const select=
        document.getElementById("rua");


    const ruas=
        Object.keys(taxas)
        .filter(
            rua=>
                !["BALCAO","RETIRADA","IFOOD","99FOOD"]
                .includes(rua)
        )
        .sort(
            (a,b)=>
                a.localeCompare(b,"pt-BR")
        );


    ruas.forEach(rua=>{

        const option=
            document.createElement("option");

        option.value=rua;

        option.textContent=
            rua+
            " — "+
            moeda(taxas[rua]);

        select.appendChild(option);

    });

}


/* ============================================================
   BUSCA
   ============================================================ */

function buscarProdutos(){

    const texto=
        document
        .getElementById("busca")
        .value
        .trim()
        .toLowerCase();


    if(!texto){

        renderizarProdutos();

        return;

    }


    const encontrados=
        produtos.filter(produto=>
            produto.nome
            .toLowerCase()
            .includes(texto)
        );


    renderizarProdutos(encontrados);

}


/* ============================================================
   IR PARA CATEGORIA
   ============================================================ */

function irPara(id){

    const elemento=
        document.getElementById(id);


    if(elemento){

        elemento.scrollIntoView({
            behavior:"smooth",
            block:"start"
        });

    }


    document
    .querySelectorAll(".cat-btn")
    .forEach(btn=>
        btn.classList.remove("ativo")
    );


    const botoes=
        document.querySelectorAll(".cat-btn");


    botoes.forEach(btn=>{

        if(btn.getAttribute("onclick") &&
           btn.getAttribute("onclick")
           .includes("'"+id+"'")){

            btn.classList.add("ativo");

        }

    });

}


/* ============================================================
   ABRIR CARRINHO
   ============================================================ */

function abrirCarrinho(){

    document
        .getElementById("overlay")
        .classList.add("aberto");

    document.body.style.overflow="hidden";

}


/* ============================================================
   FECHAR CARRINHO
   ============================================================ */

function fecharCarrinho(){

    document
        .getElementById("overlay")
        .classList.remove("aberto");

    document.body.style.overflow="";

}


/* ============================================================
   FECHAR CLICANDO FORA
   ============================================================ */

function fecharCarrinhoFora(event){

    if(event.target.id==="overlay"){

        fecharCarrinho();

    }

}


/* ============================================================
   LIMPAR
   ============================================================ */

function limparCarrinho(){

    if(carrinho.length===0){

        return;

    }


    if(
        !confirm(
            "Deseja realmente limpar o carrinho?"
        )
    ){

        return;

    }


    carrinho=[];

    salvarCarrinho();

    atualizarCarrinho();

}


/* ============================================================
   FINALIZAR PEDIDO
   ============================================================ */

function finalizarPedido(){

    if(carrinho.length===0){

        alert(
            "Adicione pelo menos um produto ao carrinho."
        );

        abrirCarrinho();

        return;

    }


    const nome=
        document
        .getElementById("nome")
        .value.trim();


    const telefone=
        document
        .getElementById("telefone")
        .value.trim();


    const tipo=
        document
        .getElementById("tipoPedido")
        .value;


    const rua=
        document
        .getElementById("rua")
        .value;


    const numero=
        document
        .getElementById("numero")
        .value.trim();


    const complemento=
        document
        .getElementById("complemento")
        .value.trim();


    const pagamento=
        document
        .getElementById("pagamento")
        .value;


    const troco=
        document
        .getElementById("troco")
        .value;


    const observacao=
        document
        .getElementById("observacao")
        .value.trim();


    if(!nome){

        alert("Digite seu nome.");

        document
        .getElementById("nome")
        .focus();

        return;

    }


    if(!telefone){

        alert("Digite seu telefone.");

        document
        .getElementById("telefone")
        .focus();

        return;

    }


    if(tipo==="ENTREGA"){

        if(!rua){

            alert("Selecione sua rua.");

            document
            .getElementById("rua")
            .focus();

            return;

        }


        if(!numero){

            alert("Digite o número do endereço.");

            document
            .getElementById("numero")
            .focus();

            return;

        }

    }


    if(!pagamento){

        alert(
            "Selecione a forma de pagamento."
        );

        document
        .getElementById("pagamento")
        .focus();

        return;

    }


    if(
        pagamento==="DINHEIRO" &&
        troco &&
        Number(troco)<=0
    ){

        alert(
            "Informe um valor válido para o troco."
        );

        return;

    }


    let subtotal=0;

    let mensagem=
        "🍔 *NOVO PEDIDO - ND BURGS*%0A"+
        "==============================%0A%0A";


    mensagem+=
        "👤 *CLIENTE:* "+
        encodeURIComponent(nome)+
        "%0A";


    mensagem+=
        "📱 *TELEFONE:* "+
        encodeURIComponent(telefone)+
        "%0A";


    mensagem+=
        "🚚 *TIPO:* "+
        encodeURIComponent(tipo)+
        "%0A";


    if(tipo==="ENTREGA"){

        mensagem+=
            "📍 *ENDEREÇO:* "+
            encodeURIComponent(
                rua+
                ", Nº "+
                numero
            )+
            "%0A";


        if(complemento){

            mensagem+=
                "🏠 *COMPLEMENTO:* "+
                encodeURIComponent(
                    complemento
                )+
                "%0A";

        }

    }


    mensagem+=
        "%0A🛒 *ITENS DO PEDIDO*%0A"+
        "------------------------------%0A";


    carrinho.forEach(item=>{

        const totalItem=
            item.preco*
            item.quantidade;


        subtotal+=totalItem;


        mensagem+=
            encodeURIComponent(
                item.quantidade+
                "x "+
                item.nome+
                " — "+
                moeda(totalItem)
            )+
            "%0A";

    });


    let taxa=0;


    if(tipo==="ENTREGA"){

        taxa=
            Number(taxas[rua] || 0);

    }


    const total=
        subtotal+taxa;


    mensagem+=
        "%0A💰 *SUBTOTAL:* "+
        encodeURIComponent(
            moeda(subtotal)
        )+
        "%0A";


    mensagem+=
        "🚚 *TAXA:* "+
        encodeURIComponent(
            moeda(taxa)
        )+
        "%0A";


    mensagem+=
        "💵 *TOTAL:* "+
        encodeURIComponent(
            moeda(total)
        )+
        "%0A";


    mensagem+=
        "💳 *PAGAMENTO:* "+
        encodeURIComponent(
            pagamento
        )+
        "%0A";


    if(
        pagamento==="DINHEIRO" &&
        troco
    ){

        mensagem+=
            "💵 *TROCO PARA:* "+
            encodeURIComponent(
                moeda(Number(troco))
            )+
            "%0A";

    }


    if(observacao){

        mensagem+=
            "%0A📝 *OBSERVAÇÃO:*%0A"+
            encodeURIComponent(
                observacao
            )+
            "%0A";

    }


    mensagem+=
        "%0A==============================%0A"+
        "ND BURGS 🍔";


    /* ========================================================
       WHATSAPP DA ND BURGS
       ======================================================== */

    const whatsapp="5511963973846";


    window.open(
        "https://wa.me/"+
        whatsapp+
        "?text="+
        mensagem,
        "_blank"
    );

}


/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */

carregarRuas();

renderizarProdutos();

atualizarCarrinho();

alterarTipoPedido();


/* ============================================================
   MÁSCARA SIMPLES DE TELEFONE
   ============================================================ */

document
.getElementById("telefone")
.addEventListener("input",function(){

    let valor=
        this.value
        .replace(/\D/g,"")
        .slice(0,11);


    if(valor.length>=11){

        valor=
            valor.replace(
                /^(\d{2})(\d{5})(\d{4}).*/,
                "($1) $2-$3"
            );

    }else if(valor.length>=7){

        valor=
            valor.replace(
                /^(\d{2})(\d{4,5})(\d{0,4}).*/,
                "($1) $2-$3"
            );

    }else if(valor.length>=3){

        valor=
            valor.replace(
                /^(\d{2})(\d*)/,
                "($1) $2"
            );

    }


    this.value=valor;

});

</script>
